<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Sky Fighter</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a1428;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#fff;touch-action:none}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;background:#0a1428}
  #hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;text-shadow:0 1px 2px #000;pointer-events:none;z-index:5}
  #hud .right{text-align:right}
  #ver{position:fixed;top:8px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.75;background:rgba(0,0,0,.4);padding:2px 8px;border-radius:10px;cursor:pointer;z-index:5}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#1a2a4d 0%,#0a1428 100%);gap:14px;z-index:10;padding:20px}
  #menu h1{font-size:34px;letter-spacing:2px;text-shadow:0 2px 8px #4af}
  #menu .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:420px}
  #menu button,#menu label{background:#2a4d8a;color:#fff;border:0;padding:10px 16px;border-radius:10px;font-size:14px;cursor:pointer;font-weight:700}
  #menu button.primary{background:#ff7a3d;font-size:18px;padding:14px 32px}
  #menu button:active{transform:scale(.96)}
  #menu .small{font-size:12px;opacity:.8;text-align:center;max-width:340px;line-height:1.5}
  #menu .preview{display:flex;gap:10px;align-items:center;justify-content:center}
  #menu .preview .box{width:64px;height:64px;border:1px dashed #6af;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;background:rgba(0,0,0,.3);overflow:hidden}
  #menu .preview .box img{max-width:100%;max-height:100%}
  input[type=file]{display:none}
  #stick{position:fixed;right:24px;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.10);border:2px solid rgba(255,255,255,.25);z-index:6;display:none;touch-action:none}
  #stick .knob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.4);border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #pause{position:fixed;right:8px;top:34px;background:rgba(0,0,0,.4);color:#fff;border:0;padding:6px 10px;border-radius:8px;font-weight:700;z-index:5;cursor:pointer;display:none}
  #toast{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);padding:14px 22px;border-radius:12px;font-size:18px;font-weight:700;z-index:7;display:none;text-align:center}
  #footer{position:fixed;right:8px;bottom:6px;font-size:10px;opacity:.55;z-index:4;pointer-events:none}
  @media (hover:hover){#stick{display:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hudL">❤️ <span id="hp">3</span> &nbsp; ⭐ <span id="score">0</span></div>
    <div class="right" id="hudR">Lv <span id="lv">1</span></div>
  </div>
  <div id="ver" title="버전">v1.1.0</div>
  <button id="pause" aria-label="일시정지" style="touch-action:manipulation">II</button>
  <div id="stick"><div class="knob" id="knob"></div></div>
  <div id="toast"></div>
  <div id="footer">CDN &amp; Cloud is by Solbox..</div>

  <div id="menu">
    <h1>✈ SKY FIGHTER</h1>
    <div class="preview">
      <div class="box" id="prevPlane">비행기</div>
      <div class="box" id="prevBg">배경</div>
    </div>
    <div class="row">
      <label for="planeFile">🛩 내 비행기 등록</label>
      <input id="planeFile" type="file" accept="image/*"/>
      <label for="bgFile">🌄 배경 등록</label>
      <input id="bgFile" type="file" accept="image/*"/>
      <button id="resetImg">기본으로</button>
    </div>
    <button id="start" class="primary">▶ 시작</button>
    <div class="small">
      PC: 방향키로 이동 · 미사일 자동발사<br>
      모바일/패드: 우측하단 조이스틱<br>
      점수가 쌓이면 👑 보스 등장!
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

// ========= util =========
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize); resize();
const isTouch = matchMedia('(hover:none)').matches || 'ontouchstart' in window;
if(isTouch){ $('stick').style.display='block'; }

// ========= storage (images) =========
const LS_PLANE='sf_plane_img', LS_BG='sf_bg_img';
function loadImg(key){
  const d = localStorage.getItem(key);
  if(!d) return null;
  const im = new Image(); im.src = d; return im;
}
let planeImg = loadImg(LS_PLANE);
let bgImg = loadImg(LS_BG);
function setPreview(){
  const p=$('prevPlane'), b=$('prevBg');
  p.innerHTML = planeImg? '' : '비행기';
  b.innerHTML = bgImg? '' : '배경';
  if(planeImg){ const im=new Image(); im.src=planeImg.src; p.appendChild(im); }
  if(bgImg){ const im=new Image(); im.src=bgImg.src; b.appendChild(im); }
}
setPreview();
function resizeDataUrl(srcUrl, maxSide, cb){
  const im = new Image();
  im.onload = ()=>{
    let w=im.naturalWidth, h=im.naturalHeight;
    const m=Math.max(w,h);
    if(m>maxSide){ const s=maxSide/m; w=Math.round(w*s); h=Math.round(h*s); }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(im,0,0,w,h);
    let q=0.85, out=c.toDataURL('image/jpeg',q);
    while(out.length>900*1024 && q>0.4){ q-=0.1; out=c.toDataURL('image/jpeg',q); }
    cb(out);
  };
  im.onerror = ()=> cb(srcUrl);
  im.src = srcUrl;
}
function readFile(f, key, setter){
  const r=new FileReader();
  r.onload=()=>{
    resizeDataUrl(r.result, 512, (data)=>{
      try{ localStorage.setItem(key, data); }
      catch(e){
        try{ localStorage.removeItem(key); localStorage.setItem(key, data); }
        catch(e2){ alert('저장 공간 부족 또는 시크릿 모드입니다. 그래도 이번 게임에는 사용해요.'); }
      }
      const im=new Image(); im.onload=()=>{ setter(im); setPreview(); }; im.src=data;
    });
  };
  r.readAsDataURL(f);
}
$('planeFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) readFile(f, LS_PLANE, im=>planeImg=im); });
$('bgFile').addEventListener('change', e=>{ const f=e.target.files[0]; if(f) readFile(f, LS_BG, im=>bgImg=im); });
$('resetImg').addEventListener('click', ()=>{
  localStorage.removeItem(LS_PLANE); localStorage.removeItem(LS_BG);
  planeImg=null; bgImg=null; setPreview();
});

// ========= audio (WebAudio, no external files) =========
let AC=null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function beep(freq, dur, type='square', vol=0.08){
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.value=vol;
  o.connect(g); g.connect(a.destination);
  const t=a.currentTime;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.start(t); o.stop(t+dur);
}
function sfxShoot(){ beep(880,0.06,'square',0.04); }
function sfxHit(){ beep(180,0.18,'sawtooth',0.10); }
function sfxBoom(){ const a=ac(); if(!a) return; for(let i=0;i<6;i++) setTimeout(()=>beep(120+Math.random()*80,0.12,'triangle',0.10),i*30); }
function sfxBoss(){ beep(220,0.2,'sine',0.12); setTimeout(()=>beep(160,0.3,'sine',0.12),180); }
// simple looping bgm via scheduled notes
let bgmTimer=null, bgmStep=0;
const BGM = [262,330,392,330, 294,349,440,349, 330,392,494,392, 262,330,392,523];
function bgmStart(){
  bgmStop();
  bgmTimer = setInterval(()=>{
    const f = BGM[bgmStep++ % BGM.length];
    beep(f, 0.18, 'triangle', 0.035);
    if(bgmStep%4===0) beep(f/2, 0.22, 'sine', 0.025);
  }, 240);
}
function bgmStop(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }

// ========= input =========
const keys = {};
addEventListener('keydown', e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key]=true;
  if(e.key==='p'||e.key==='P') togglePause();
});
addEventListener('keyup', e=>{ keys[e.key]=false; });
addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && !state.running && $('menu').style.display!=='none'){
    $('start').click();
  }
});

// joystick
let stickVec = {x:0,y:0};
(function(){
  const s=$('stick'), k=$('knob');
  let active=false, cx=0, cy=0, R=70;
  function setKnob(dx,dy){
    const d=Math.hypot(dx,dy); const m=Math.min(d,R);
    const a=Math.atan2(dy,dx);
    const x=Math.cos(a)*m, y=Math.sin(a)*m;
    k.style.transform = `translate(${x}px,${y}px)`;
    stickVec.x = x/R; stickVec.y = y/R;
  }
  function start(t){ const r=s.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; active=true; move(t); }
  function move(t){ if(!active) return; setKnob(t.clientX-cx, t.clientY-cy); }
  function end(){ active=false; setKnob(0,0); }
  s.addEventListener('touchstart', e=>{ e.preventDefault(); start(e.touches[0]); }, {passive:false});
  s.addEventListener('touchmove',  e=>{ e.preventDefault(); move(e.touches[0]); }, {passive:false});
  s.addEventListener('touchend',   e=>{ e.preventDefault(); end(); }, {passive:false});
  s.addEventListener('mousedown', e=>{ start(e); });
  addEventListener('mousemove', e=>{ if(active) move(e); });
  addEventListener('mouseup', end);
})();

// ========= game state =========
const state = { running:false, paused:false, score:0, hp:3, lv:1, t:0, bossActive:false, bossSpawnAt:30 };
const player = { x:0, y:0, w:54, h:54, cool:0, inv:0 };
const bullets = []; // {x,y,vx,vy,r,from}
const enemies = []; // {x,y,w,h,hp,kind,vy,vx,t,maxHp}
const fx = []; // particles
const clouds = [];
function reset(){
  state.running=true; state.paused=false; state.score=0; state.hp=3; state.lv=1; state.t=0; state.bossActive=false; state.bossSpawnAt=30;
  player.x=W/2; player.y=H*0.78; player.cool=0; player.inv=60;
  bullets.length=0; enemies.length=0; fx.length=0; clouds.length=0;
  for(let i=0;i<14;i++) clouds.push(makeCloud(true));
  $('hp').textContent=state.hp; $('score').textContent=0; $('lv').textContent=1;
}
function makeCloud(spread){
  return { x:Math.random()*W, y: spread? Math.random()*H : -60, r:30+Math.random()*60, v:20+Math.random()*40, a:0.4+Math.random()*0.5 };
}

// ========= drawing =========
function drawDefaultPlane(x,y,w,h){
  ctx.save(); ctx.translate(x,y);
  // body
  ctx.fillStyle='#e8eef7';
  ctx.beginPath();
  ctx.moveTo(0,-h/2);
  ctx.quadraticCurveTo(w*0.18,-h*0.1, w*0.12,h*0.45);
  ctx.lineTo(-w*0.12,h*0.45);
  ctx.quadraticCurveTo(-w*0.18,-h*0.1, 0,-h/2);
  ctx.fill();
  // wings
  ctx.fillStyle='#5b8def';
  ctx.beginPath();
  ctx.moveTo(-w*0.5, h*0.1); ctx.lineTo(w*0.5, h*0.1);
  ctx.lineTo(w*0.18, h*0.25); ctx.lineTo(-w*0.18, h*0.25); ctx.closePath(); ctx.fill();
  // tail
  ctx.fillStyle='#3b6fd6';
  ctx.beginPath(); ctx.moveTo(-w*0.18,h*0.35); ctx.lineTo(w*0.18,h*0.35); ctx.lineTo(w*0.1,h*0.5); ctx.lineTo(-w*0.1,h*0.5); ctx.closePath(); ctx.fill();
  // cockpit
  ctx.fillStyle='#7ad1ff';
  ctx.beginPath(); ctx.ellipse(0,-h*0.05,w*0.12,h*0.18,0,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function drawEnemy(e){
  ctx.save(); ctx.translate(e.x,e.y);
  if(e.kind==='boss'){
    // crown boss
    ctx.fillStyle='#7a2bd6';
    ctx.beginPath(); ctx.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffd84a';
    // crown points
    const cw=e.w*0.7;
    ctx.beginPath();
    ctx.moveTo(-cw/2,-e.h*0.35);
    ctx.lineTo(-cw/4,-e.h*0.6); ctx.lineTo(0,-e.h*0.4);
    ctx.lineTo(cw/4,-e.h*0.6); ctx.lineTo(cw/2,-e.h*0.35); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-e.w*0.15,0,5,0,Math.PI*2); ctx.arc(e.w*0.15,0,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-e.w*0.15,0,2.5,0,Math.PI*2); ctx.arc(e.w*0.15,0,2.5,0,Math.PI*2); ctx.fill();
    // hp bar
    const bw=e.w, bh=6, ratio=Math.max(0,e.hp/e.maxHp);
    ctx.fillStyle='#400'; ctx.fillRect(-bw/2, -e.h/2-14, bw, bh);
    ctx.fillStyle='#f44'; ctx.fillRect(-bw/2, -e.h/2-14, bw*ratio, bh);
  } else {
    ctx.fillStyle='#ef5b5b';
    ctx.beginPath();
    ctx.moveTo(0,e.h/2);
    ctx.quadraticCurveTo(e.w*0.5,0,0,-e.h/2);
    ctx.quadraticCurveTo(-e.w*0.5,0,0,e.h/2);
    ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(0,0,4,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}
function drawBg(){
  // sky gradient
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#71b6ff'); g.addColorStop(0.6,'#bfe1ff'); g.addColorStop(1,'#e9f4ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(bgImg && bgImg.complete && bgImg.naturalWidth){
    // cover-fit, slight scroll
    const iw=bgImg.naturalWidth, ih=bgImg.naturalHeight;
    const s=Math.max(W/iw, H/ih);
    const dw=iw*s, dh=ih*s;
    const off = (state.t*0.5) % dh;
    ctx.globalAlpha=0.85;
    ctx.drawImage(bgImg, (W-dw)/2, -off, dw, dh);
    if(off>0) ctx.drawImage(bgImg, (W-dw)/2, -off+dh, dw, dh);
    ctx.globalAlpha=1;
  }
  // clouds
  for(const c of clouds){
    ctx.globalAlpha=c.a;
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.arc(c.x+c.r*0.7,c.y+c.r*0.1,c.r*0.7,0,Math.PI*2);
    ctx.arc(c.x-c.r*0.7,c.y+c.r*0.15,c.r*0.65,0,Math.PI*2);
    ctx.arc(c.x+c.r*0.2,c.y-c.r*0.4,c.r*0.5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ========= update =========
function spawnEnemy(){
  const x=40+Math.random()*(W-80);
  const w=40, h=40;
  const hp=1+Math.floor(state.lv/2);
  enemies.push({x,y:-30,w,h,hp,maxHp:hp,kind:'mob',vy:60+state.lv*8+Math.random()*30,vx:(Math.random()-0.5)*30,t:0});
}
function spawnBoss(){
  state.bossActive=true;
  enemies.push({x:W/2,y:-80,w:140,h:120,hp:30+state.lv*8,maxHp:30+state.lv*8,kind:'boss',vy:30,vx:60,t:0});
  toast('👑 BOSS!'); sfxBoss();
}
function shoot(){
  if(player.cool>0) return;
  bullets.push({x:player.x-10,y:player.y-20,vx:0,vy:-520,r:4,from:'p'});
  bullets.push({x:player.x+10,y:player.y-20,vx:0,vy:-520,r:4,from:'p'});
  player.cool = 0.16;
  sfxShoot();
}
function enemyShoot(e){
  const a=Math.atan2(player.y-e.y, player.x-e.x);
  bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,r:5,from:'e'});
}
function explode(x,y,n=14,col='#ff8'){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=80+Math.random()*180;
    fx.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.6+Math.random()*0.4,col});
  }
}
function toast(msg, ms=1400){
  const t=$('toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(toast._h); toast._h=setTimeout(()=>{ t.style.display='none'; }, ms);
}

let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last){ last=ts; return; }
  const dt=Math.min(0.033, (ts-last)/1000 || 0); last=ts;
  if(!state.running || state.paused){ render(); return; }
  state.t += dt;

  // input vector
  let vx=0, vy=0;
  if(keys.ArrowLeft) vx-=1; if(keys.ArrowRight) vx+=1;
  if(keys.ArrowUp) vy-=1; if(keys.ArrowDown) vy+=1;
  if(stickVec.x||stickVec.y){ vx=stickVec.x; vy=stickVec.y; }
  const sp=320;
  player.x += vx*sp*dt; player.y += vy*sp*dt;
  player.x = Math.max(24, Math.min(W-24, player.x));
  player.y = Math.max(24, Math.min(H-24, player.y));

  // auto fire
  player.cool -= dt; if(player.cool<=0) shoot();
  player.inv = Math.max(0, player.inv - 1);

  // spawn
  if(!state.bossActive){
    if(Math.random()<0.012 + state.lv*0.004) spawnEnemy();
    if(state.score >= state.bossSpawnAt) spawnBoss();
  }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.y<-20||b.y>H+20||b.x<-20||b.x>W+20){ bullets.splice(i,1); continue; }
    if(b.from==='p'){
      for(let j=enemies.length-1;j>=0;j--){
        const e=enemies[j];
        if(Math.abs(b.x-e.x)<e.w/2 && Math.abs(b.y-e.y)<e.h/2){
          e.hp--; bullets.splice(i,1);
          explode(b.x,b.y,4,'#ff0');
          if(e.hp<=0){
            explode(e.x,e.y, e.kind==='boss'?40:14, e.kind==='boss'?'#f6c':'#fc4');
            sfxBoom();
            state.score += e.kind==='boss'?50:1;
            if(e.kind==='boss'){
              state.bossActive=false; state.lv++; state.bossSpawnAt = state.score + 30 + state.lv*10;
              $('lv').textContent=state.lv; toast('LEVEL UP! Lv '+state.lv);
            }
            enemies.splice(j,1);
          }
          $('score').textContent=state.score;
          break;
        }
      }
    } else {
      if(player.inv<=0 && Math.abs(b.x-player.x)<22 && Math.abs(b.y-player.y)<22){
        bullets.splice(i,1); hitPlayer();
      }
    }
  }

  // enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.t+=dt;
    if(e.kind==='boss'){
      e.x += e.vx*dt;
      if(e.x<e.w/2){ e.x=e.w/2; e.vx*=-1; }
      if(e.x>W-e.w/2){ e.x=W-e.w/2; e.vx*=-1; }
      if(e.y < 100) e.y += e.vy*dt;
      if(e.t>1.1){ e.t=0; enemyShoot(e); }
    } else {
      e.x += e.vx*dt; e.y += e.vy*dt;
      if(e.x<20||e.x>W-20) e.vx*=-1;
      if(e.y>H+30){ enemies.splice(i,1); continue; }
    }
    if(player.inv<=0 && Math.abs(e.x-player.x)<(e.w+30)/2 && Math.abs(e.y-player.y)<(e.h+30)/2){
      hitPlayer();
      if(e.kind!=='boss'){ explode(e.x,e.y,12,'#fc4'); sfxBoom(); enemies.splice(i,1); }
    }
  }

  // fx
  for(let i=fx.length-1;i>=0;i--){
    const p=fx[i];
    p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.96; p.vy*=0.96;
    if(p.life<=0) fx.splice(i,1);
  }

  // clouds
  for(const c of clouds){
    c.y += c.v*dt;
    if(c.y - c.r > H){ Object.assign(c, makeCloud(false)); }
  }

  render();
}
function hitPlayer(){
  if(player.inv>0) return;
  state.hp--; player.inv=80; sfxHit();
  explode(player.x,player.y,16,'#f88');
  $('hp').textContent=state.hp;
  if(state.hp<=0) gameOver();
}
function gameOver(){
  state.running=false; bgmStop();
  toast('GAME OVER  ⭐ '+state.score, 3000);
  setTimeout(()=>{ $('menu').style.display='flex'; $('pause').style.display='none'; }, 1200);
}

function render(){
  drawBg();
  // bullets
  for(const b of bullets){
    ctx.fillStyle = b.from==='p' ? '#ffe14a' : '#ff6';
    if(b.from==='e') ctx.fillStyle='#f55';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
  }
  // enemies
  for(const e of enemies) drawEnemy(e);
  // player
  ctx.save();
  if(player.inv>0 && (Math.floor(state.t*20)%2)) ctx.globalAlpha=0.4;
  if(planeImg && planeImg.complete && planeImg.naturalWidth){
    const w=60,h=60;
    ctx.drawImage(planeImg, player.x-w/2, player.y-h/2, w, h);
  } else {
    drawDefaultPlane(player.x, player.y, player.w, player.h);
  }
  ctx.restore();
  // particles
  for(const p of fx){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.col;
    ctx.fillRect(p.x-2,p.y-2,4,4);
  }
  ctx.globalAlpha=1;
}
requestAnimationFrame(loop);

// ========= controls =========
function togglePause(){
  if(!state.running) return;
  state.paused=!state.paused;
  $('pause').textContent = state.paused? '▶' : 'II';
  const a=ac(); if(a && a.state==='suspended') a.resume();
  if(state.paused) bgmStop(); else bgmStart();
}
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ bgmStop(); }
  else if(state.running && !state.paused){
    const a=ac(); if(a && a.state==='suspended') a.resume();
    bgmStart();
  }
});
$('pause').addEventListener('click', togglePause);
$('start').addEventListener('click', ()=>{
  ac(); // unlock audio
  $('menu').style.display='none';
  $('pause').style.display='block';
  reset(); bgmStart();
});

})();
</script>
</body>
