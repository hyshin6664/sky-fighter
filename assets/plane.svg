<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200" width="256" height="256">
  <defs>
    <linearGradient id="body" x1="-15" y1="-80" x2="15" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4a78ad"/>
      <stop offset="0.5" stop-color="#6ea0d2"/>
      <stop offset="1" stop-color="#3a608c"/>
    </linearGradient>
    <linearGradient id="wing" x1="-70" y1="0" x2="70" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3e6ea3"/>
      <stop offset="0.5" stop-color="#5b8ec5"/>
      <stop offset="1" stop-color="#3e6ea3"/>
    </linearGradient>
    <radialGradient id="cockpit" cx="0" cy="-40" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfe6ff"/>
      <stop offset="0.5" stop-color="#5a8fc8"/>
      <stop offset="1" stop-color="#1a2d4a"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="55" x2="0" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffe680"/>
      <stop offset="0.7" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ff5028" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- engine flame -->
  <path d="M -12 55 Q 0 90 12 55 Z" fill="url(#flame)"/>

  <!-- rear tailerons -->
  <path d="M -30 40 L -46 62 L -22 58 L -12 46 Z" fill="#1f4470"/>
  <path d="M 30 40 L 46 62 L 22 58 L 12 46 Z" fill="#1f4470"/>

  <!-- twin vertical stabilizers -->
  <path d="M -18 30 L -26 52 L -14 48 L -10 32 Z" fill="#163558"/>
  <path d="M 18 30 L 26 52 L 14 48 L 10 32 Z" fill="#163558"/>

  <!-- main wings -->
  <path d="M 0 -5 L 76 28 L 64 38 L 8 18 L -8 18 L -64 38 L -76 28 Z" fill="url(#wing)"/>

  <!-- camo blotches -->
  <g fill="#2a4d75">
    <circle cx="-50" cy="22" r="8"/>
    <circle cx="-30" cy="18" r="6"/>
    <circle cx="40" cy="24" r="9"/>
    <circle cx="55" cy="30" r="6"/>
    <circle cx="20" cy="22" r="5"/>
    <circle cx="-20" cy="20" r="4"/>
  </g>
  <g fill="#9bc8f0">
    <circle cx="-58" cy="30" r="4"/>
    <circle cx="-40" cy="26" r="3"/>
    <circle cx="48" cy="32" r="4"/>
  </g>

  <!-- missiles under wings -->
  <g>
    <rect x="-48" y="18" width="4" height="22" fill="#d8d8e0"/>
    <rect x="-48" y="18" width="4" height="4" fill="#c84444"/>
    <polygon points="-48,18 -44,18 -46,12" fill="#1a1a22"/>

    <rect x="-30" y="18" width="4" height="22" fill="#d8d8e0"/>
    <rect x="-30" y="18" width="4" height="4" fill="#c84444"/>
    <polygon points="-30,18 -26,18 -28,12" fill="#1a1a22"/>

    <rect x="26" y="18" width="4" height="22" fill="#d8d8e0"/>
    <rect x="26" y="18" width="4" height="4" fill="#c84444"/>
    <polygon points="26,18 30,18 28,12" fill="#1a1a22"/>

    <rect x="44" y="18" width="4" height="22" fill="#d8d8e0"/>
    <rect x="44" y="18" width="4" height="4" fill="#c84444"/>
    <polygon points="44,18 48,18 46,12" fill="#1a1a22"/>
  </g>

  <!-- fuselage -->
  <path d="M 0 -78 C 8 -70 12 -40 12 -10 L 14 30 C 14 40 8 52 0 55 C -8 52 -14 40 -14 30 L -12 -10 C -12 -40 -8 -70 0 -78 Z"
        fill="url(#body)" stroke="rgba(0,0,0,0.4)" stroke-width="1"/>

  <!-- red center stripe -->
  <rect x="-6" y="-15" width="12" height="40" fill="#c43030"/>
  <rect x="-7" y="15" width="14" height="2" fill="#9a2020"/>
  <rect x="-7" y="-5" width="14" height="2" fill="#9a2020"/>

  <!-- body camo -->
  <g fill="#2d537a">
    <circle cx="-6" cy="-30" r="4"/>
    <circle cx="7" cy="-10" r="3"/>
    <circle cx="-5" cy="10" r="3.5"/>
    <circle cx="6" cy="25" r="3"/>
    <circle cx="-3" cy="40" r="2.5"/>
  </g>

  <!-- cockpit -->
  <ellipse cx="0" cy="-42" rx="9" ry="18" fill="url(#cockpit)" stroke="#0a1628" stroke-width="1.5"/>
  <ellipse cx="-3" cy="-48" rx="3" ry="7" fill="rgba(255,255,255,0.3)"/>

  <!-- nose tip -->
  <circle cx="0" cy="-78" r="2" fill="#0a1628"/>
</svg>
